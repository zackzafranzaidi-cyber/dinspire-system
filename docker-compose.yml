version: '3.8'

services:
  dinspire-backend:
    build: .
    container_name: dinspire_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # Jangan masukkan rahsia sebenar di sini, letakkannya di dalam fail .env di VPS Tuan
      - JWT_SECRET_CLIENT=${JWT_SECRET_CLIENT}
      - JWT_SECRET_SYS=${JWT_SECRET_SYS}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - TOYYIBPAY_URL=${TOYYIBPAY_URL}
      - TOYYIBPAY_SECRET_KEY=${TOYYIBPAY_SECRET_KEY}
      - TOYYIBPAY_CATEGORY_CODE=${TOYYIBPAY_CATEGORY_CODE}
    networks:
      - dinspire-network

networks:
  dinspire-network:
    driver: bridge
