<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muat Turun Arkib Resit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full bg-gray-800 p-8 rounded-2xl shadow-xl text-center">
    <h2 class="text-2xl font-bold mb-4">Muat Turun Arkib Resit</h2>
    <p class="text-gray-300 mb-6" id="statusText">Sila tunggu, memuatkan data...</p>
    
    <div class="w-full bg-gray-700 rounded-full h-4 mb-6 overflow-hidden">
      <div id="progressBar" class="bg-blue-500 h-4 rounded-full" style="width: 0%"></div>
    </div>
    
    <p id="progressText" class="text-sm text-gray-400">0 / 0 Resit diproses</p>
    
    <button id="downloadBtn" class="mt-6 w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded-xl hidden transition">
      Muat Turun Selesai (Klik Jika Belum)
    </button>
  </div>

  <script type="module">
    import JSZip from "https://cdn.jsdelivr.net/npm/jszip/+esm";
    import saveAs from "https://cdn.jsdelivr.net/npm/file-saver/+esm";
    import * as XLSX from "https://cdn.jsdelivr.net/npm/xlsx/+esm";

    async function runDownload() {
      const urlParams = new URLSearchParams(window.location.search);
      const targetMonth = urlParams.get("month");
      const targetYear = urlParams.get("year");

      if (!targetMonth || !targetYear) {
        document.getElementById("statusText").innerText = "Parameter tidak lengkap.";
        return;
      }

      document.getElementById("statusText").innerText = "Sila tunggu, memuatkan data pelayan...";
      let zip = new JSZip();

      try {
        const apiBaseUrl = window.location.hostname === 'localhost' ? 'http://localhost:10000' : 'https://api.dinspirebarbershop.com';
        const res = await fetch(`${apiBaseUrl}/api/owner/monthly-archive-data?month=${targetMonth}&year=${targetYear}`);
        const data = await res.json();
        
        if (!data || !data.rawData) {
          document.getElementById("statusText").innerText = "Ralat mengambil data laporan.";
          return;
        }

        document.getElementById("statusText").innerText = "Memproses laporan Excel...";
        
        // Bina fail Excel berbilang helaian (sheets)
        const wb = XLSX.utils.book_new();
        
        const sheetNames = Object.keys(data.rawData);
        let hasData = false;
        
        sheetNames.forEach(sheetName => {
          const sheetData = data.rawData[sheetName];
          if (sheetData && sheetData.length > 0) {
            hasData = true;
            const ws = XLSX.utils.json_to_sheet(sheetData);
            XLSX.utils.book_append_sheet(wb, ws, sheetName);
          }
        });

        if (!hasData) {
          const ws = XLSX.utils.json_to_sheet([{ Nota: "Tiada Rekod Bulan Ini" }]);
          XLSX.utils.book_append_sheet(wb, ws, "Kosong");
        }

        const excelBuffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        zip.file(`Laporan_Bulanan_${targetMonth}_${targetYear}.xlsx`, excelBuffer);

        const allUrls = data.imageUrls || [];

        if (allUrls.length === 0) {
          document.getElementById("statusText").innerText = "Tiada gambar resit dijumpai untuk bulan ini.";
          // Kita masih teruskan untuk zip CSV
        } else {
          document.getElementById("progressText").innerText = `0 / ${allUrls.length} Resit dimuat turun`;
          let count = 0;

          const limit = 10; 
          for (let i = 0; i < allUrls.length; i += limit) {
            const chunk = allUrls.slice(i, i + limit);
            await Promise.all(chunk.map(async (item) => {
              try {
                const response = await fetch(item.url);
                const blob = await response.blob();
                zip.file(item.name, blob);
              } catch (e) {
                console.error("Gagal muat turun:", item.url);
              }
              count++;
              let p = Math.round((count / allUrls.length) * 100);
              document.getElementById("progressBar").style.width = p + "%";
              document.getElementById("progressText").innerText = `${count} / ${allUrls.length} Resit dimuat turun`;
            }));
          }
        }

        document.getElementById("statusText").innerText = "Memampatkan fail ZIP... Sila tunggu.";
        
        zip.generateAsync({ type: "blob" }).then(function (content) {
          const zipName = `Laporan_Dan_Resit_${targetYear}_${targetMonth}.zip`;
          saveAs(content, zipName);
          document.getElementById("statusText").innerText = "Muat Turun Berjaya!";
          document.getElementById("downloadBtn").classList.remove("hidden");
          document.getElementById("downloadBtn").onclick = () => saveAs(content, zipName);
        });

      } catch (err) {
        document.getElementById("statusText").innerText = "Berlaku ralat: " + err.message;
      }
    }
    
    // Mulakan proses muat turun
    runDownload();
  </script>
</body>
</html>
